name: Build & Release Lumio

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Lumio
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install .NET Android Workload & SDK Dependencies
        run: |
          dotnet workload install android
          dotnet build src/Lumio.App.Android/Lumio.App.Android.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:JavaSdkDirectory="$env:JAVA_HOME" -p:AcceptAndroidSDKLicenses=True -nologo

      - name: Restore Dependencies
        run: dotnet restore Lumio.slnx

      - name: Run Unit Tests
        run: dotnet test tests/Lumio.Tests/Lumio.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish Standalone (win-x64)
        run: |
          dotnet publish src/Lumio.App/Lumio.App.csproj -c Release -r win-x64 --self-contained true -o ./dist/win-x64 -p:PublishSingleFile=false -nologo
          Compress-Archive -Path ./dist/win-x64/* -DestinationPath ./dist/Lumio-win-x64.zip

      - name: Publish Standalone (win-arm64 for Surface)
        run: |
          dotnet publish src/Lumio.App/Lumio.App.csproj -c Release -r win-arm64 --self-contained true -o ./dist/win-arm64 -p:PublishSingleFile=false -nologo
          Compress-Archive -Path ./dist/win-arm64/* -DestinationPath ./dist/Lumio-win-arm64.zip

      - name: Publish Standalone (linux-arm64 for Raspberry Pi)
        run: |
          dotnet publish src/Lumio.App.Avalonia/Lumio.App.Avalonia.csproj -c Release -r linux-arm64 --self-contained true -o ./dist/linux-arm64 -p:PublishSingleFile=false -nologo
          Copy-Item run-lumio.sh ./dist/linux-arm64/run-lumio.sh
          ((Get-Content ./dist/linux-arm64/run-lumio.sh -Raw) -replace "`r`n", "`n") | Set-Content -NoNewline -Path ./dist/linux-arm64/run-lumio.sh
          Compress-Archive -Path ./dist/linux-arm64/* -DestinationPath ./dist/Lumio-linux-arm64.zip

      - name: Publish Standalone (linux-x64 for PC / CachyOS / Arch / Ubuntu)
        run: |
          dotnet publish src/Lumio.App.Avalonia/Lumio.App.Avalonia.csproj -c Release -r linux-x64 --self-contained true -o ./dist/linux-x64 -p:PublishSingleFile=false -nologo
          Copy-Item run-lumio.sh ./dist/linux-x64/run-lumio.sh
          ((Get-Content ./dist/linux-x64/run-lumio.sh -Raw) -replace "`r`n", "`n") | Set-Content -NoNewline -Path ./dist/linux-x64/run-lumio.sh
          Compress-Archive -Path ./dist/linux-x64/* -DestinationPath ./dist/Lumio-linux-x64.zip

      - name: Build Android APK & App Bundle (Google Play)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $signing = @()
          if ($env:ANDROID_KEYSTORE_BASE64) {
            # Stable release key: lets users update the app without uninstalling
            $keystore = Join-Path $env:RUNNER_TEMP "lumio-release.keystore"
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $signing = @(
              "-p:AndroidKeyStore=true",
              "-p:AndroidSigningKeyStore=$keystore",
              "-p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD",
              "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
              "-p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD"
            )
          } else {
            Write-Host "::warning::No Android signing key configured (ANDROID_KEYSTORE_BASE64) - APK is signed with a temporary debug key."
          }

          dotnet publish src/Lumio.App.Android/Lumio.App.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:JavaSdkDirectory="$env:JAVA_HOME" -o ./dist/android -nologo @signing
          $apk = Get-ChildItem ./dist/android -Filter "*-Signed.apk" | Select-Object -First 1
          if (-not $apk) { throw "No signed APK was produced." }
          Copy-Item $apk.FullName ./dist/Lumio-android.apk
          # App bundle for uploading to Google Play (signed with the same key, used as upload key)
          dotnet publish src/Lumio.App.Android/Lumio.App.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=aab -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:JavaSdkDirectory="$env:JAVA_HOME" -o ./dist/android-aab -nologo @signing
          $aab = Get-ChildItem ./dist/android-aab -Filter "*-Signed.aab" | Select-Object -First 1
          if (-not $aab) { throw "No signed app bundle was produced." }
          Copy-Item $aab.FullName ./dist/Lumio-android.aab

      - name: Upload Artifacts (Action Run)
        uses: actions/upload-artifact@v4
        with:
          name: Lumio-Builds
          path: |
            ./dist/*.zip
            ./dist/Lumio-android.apk
            ./dist/Lumio-android.aab

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Lumio Release ${{ github.ref_name }}"
          body: |
            ## Lumio Release ${{ github.ref_name }} – Drucken per USB & neue Lizenz 🖨️

            Der Canon Selphy druckt jetzt auch per USB direkt vom Handy oder Tablet – Kamera, Drucker und Strom passen an einen USB-Hub, ganz ohne WLAN.

            ### Highlights
            - **Selphy per USB auf Android** (z. B. CP1300, CP1500): erscheint als „(USB)“ in der Druckerauswahl.
            - **Randlos passt genau**: das ganze Foto samt Rahmen und Text auf der Karte (USB und WLAN).
            - **Behoben**: Kamera- und Druckerauswahl im Admin-Menü springen nicht mehr zurück.
            - **Neue Lizenz PolyForm Shield 1.0.0**: Event-Einsatz bleibt kostenlos und auch gewerblich erlaubt, den Code darf man jetzt ändern und weitergeben.

            ### Downloads & Plattformen
            - **`Lumio-android.apk`**: Für Android-Tablets & -Handys (Sideloading – Anleitung im README, Play-Store-Release ist geplant)
            - **`Lumio-android.aab`**: App Bundle für den Upload in die Google Play Console
            - **`Lumio-win-x64.zip`**: Für normale 64-Bit Windows PCs & Laptops
            - **`Lumio-win-arm64.zip`**: Für Microsoft Surface Pro / Laptop mit ARM-Prozessor
            - **`Lumio-linux-x64.zip`**: Für Linux PCs (CachyOS, Arch Linux, Ubuntu, Debian, Fedora etc.)
            - **`Lumio-linux-arm64.zip`**: Für Raspberry Pi 4 / 5 (64-Bit Raspberry Pi OS)

            *Alle Desktop-Builds sind vollständig eigenständig gebündelt (self-contained) und benötigen keine vorinstallierte .NET Runtime.*

            Alle Änderungen im Detail: [CHANGELOG.md](https://github.com/mazls/lumio/blob/main/CHANGELOG.md)
          files: |
            ./dist/Lumio-android.apk
            ./dist/Lumio-android.aab
            ./dist/Lumio-win-x64.zip
            ./dist/Lumio-win-arm64.zip
            ./dist/Lumio-linux-x64.zip
            ./dist/Lumio-linux-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Update Latest Release (on Main Push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lumio Latest Build"
          body: |
            Automatisch gebauter Standalone-Build von Branch `main`.
            
            - **Lumio-win-x64.zip**: Für normale 64-Bit Windows PCs & Laptops
            - **Lumio-win-arm64.zip**: Für Microsoft Surface Pro / Laptop mit ARM-Prozessor
            - **Lumio-linux-x64.zip**: Für x86_64 Linux PCs (CachyOS, Arch Linux, Ubuntu, Debian, Fedora etc.)
            - **Lumio-linux-arm64.zip**: Für Raspberry Pi (Pi 4 / Pi 5 mit 64-Bit Raspberry Pi OS)
            - **Lumio-android.apk**: Für Android-Tablets & -Handys (Sideloading, Anleitung im README)
            
            Einfach entpacken und starten (`Lumio.exe` auf Windows, `./run-lumio.sh` auf Linux) bzw. die APK auf dem Android-Gerät installieren.
          files: |
            ./dist/Lumio-android.apk
            ./dist/Lumio-win-x64.zip
            ./dist/Lumio-win-arm64.zip
            ./dist/Lumio-linux-x64.zip
            ./dist/Lumio-linux-arm64.zip
          draft: false
          prerelease: false
          # Rolling dev build: must never become GitHub's "latest release" (download links, update check)
          make_latest: false
