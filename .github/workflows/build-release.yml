name: Build & Release Lumio

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Lumio
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Lumio.slnx

      - name: Run Unit Tests
        run: dotnet test Lumio.slnx -c Release --no-restore --verbosity normal

      - name: Publish Standalone (win-x64)
        run: |
          dotnet publish src/Lumio.App/Lumio.App.csproj -c Release -r win-x64 --self-contained true -o ./dist/win-x64 -p:PublishSingleFile=false -nologo
          Compress-Archive -Path ./dist/win-x64/* -DestinationPath ./dist/Lumio-win-x64.zip

      - name: Publish Standalone (win-arm64 for Surface)
        run: |
          dotnet publish src/Lumio.App/Lumio.App.csproj -c Release -r win-arm64 --self-contained true -o ./dist/win-arm64 -p:PublishSingleFile=false -nologo
          Compress-Archive -Path ./dist/win-arm64/* -DestinationPath ./dist/Lumio-win-arm64.zip

      - name: Publish Standalone (linux-arm64 for Raspberry Pi)
        run: |
          dotnet publish src/Lumio.App.Avalonia/Lumio.App.Avalonia.csproj -c Release -r linux-arm64 --self-contained true -o ./dist/linux-arm64 -p:PublishSingleFile=false -nologo
          Copy-Item run-lumio.sh ./dist/linux-arm64/run-lumio.sh
          ((Get-Content ./dist/linux-arm64/run-lumio.sh -Raw) -replace "`r`n", "`n") | Set-Content -NoNewline -Path ./dist/linux-arm64/run-lumio.sh
          Compress-Archive -Path ./dist/linux-arm64/* -DestinationPath ./dist/Lumio-linux-arm64.zip

      - name: Publish Standalone (linux-x64 for PC / CachyOS / Arch / Ubuntu)
        run: |
          dotnet publish src/Lumio.App.Avalonia/Lumio.App.Avalonia.csproj -c Release -r linux-x64 --self-contained true -o ./dist/linux-x64 -p:PublishSingleFile=false -nologo
          Copy-Item run-lumio.sh ./dist/linux-x64/run-lumio.sh
          ((Get-Content ./dist/linux-x64/run-lumio.sh -Raw) -replace "`r`n", "`n") | Set-Content -NoNewline -Path ./dist/linux-x64/run-lumio.sh
          Compress-Archive -Path ./dist/linux-x64/* -DestinationPath ./dist/Lumio-linux-x64.zip

      - name: Upload Artifacts (Action Run)
        uses: actions/upload-artifact@v4
        with:
          name: Lumio-Builds
          path: |
            ./dist/*.zip

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Lumio Release ${{ github.ref_name }}"
          body: |
            ## Lumio Release ${{ github.ref_name }} – Das große Fotobox-Update 📸

            ### Highlights
            - **Natives DSLR / DSLM Tethering (wie in dslrBooth)**: Läuft direkt im Lumio-Prozess per USB PTP – ohne externe Zusatzsoftware und ohne Nikon Webcam Utility. Unterstützt Nikon D5600, Z 50 II, Canon EOS, Sony, Fuji etc.
            - **Live-View & 24MP-Auslösung**: Glasklare Live-Vorschau und verlässliche Auslösung mit automatischem Spiegel-Zyklus und Autofokus-Sicherheitsnetz (`CapturePhotoNoAf`).
            - **📸 Testfoto-Vorschau**: Neuer Testfoto-Button in den Kamera-Einstellungen (temporäre Vorschau zur Belichtungs- & Fokusprüfung ohne Abspeichern).
            - **Touch-Admin-Menü & Bildschirmtastatur**: 4 übersichtliche Tabs (Allgemein, Kamera, Aufnahme, Drucker) und integrierte On-Screen-Tastatur für Touchscreens.
            - **Kein UI-Hänger**: Asynchrones Hardware-Laden und Drucker-Spooler-Caching für sofortiges Öffnen des Menüs.
            - **USB-Stick Auto-Erkennung**: Erkennt angeschlossene USB-Sticks sofort im Admin-Menü zur 1-Klick-Sicherung.
            - **Selphy Direktdruck**: Canon Selphy CP1300/CP1500 Auto-Sofortdruck und Testdruck.

            ### Downloads & Plattformen
            - **`Lumio-win-x64.zip`**: Für normale 64-Bit Windows PCs & Laptops
            - **`Lumio-win-arm64.zip`**: Für Microsoft Surface Pro / Laptop mit ARM-Prozessor
            - **`Lumio-linux-x64.zip`**: Für Linux PCs (CachyOS, Arch Linux, Ubuntu, Debian, Fedora etc.)
            - **`Lumio-linux-arm64.zip`**: Für Raspberry Pi 4 / 5 (64-Bit Raspberry Pi OS)

            *Alle Builds sind vollständig eigenständig gebündelt (self-contained) und benötigen keine vorinstallierte .NET Runtime.*
          files: |
            ./dist/Lumio-win-x64.zip
            ./dist/Lumio-win-arm64.zip
            ./dist/Lumio-linux-x64.zip
            ./dist/Lumio-linux-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Update Latest Release (on Main Push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Lumio Latest Build"
          body: |
            Automatisch gebauter Standalone-Build von Branch `main`.
            
            - **Lumio-win-x64.zip**: Für normale 64-Bit Windows PCs & Laptops
            - **Lumio-win-arm64.zip**: Für Microsoft Surface Pro / Laptop mit ARM-Prozessor
            - **Lumio-linux-x64.zip**: Für x86_64 Linux PCs (CachyOS, Arch Linux, Ubuntu, Debian, Fedora etc.)
            - **Lumio-linux-arm64.zip**: Für Raspberry Pi (Pi 4 / Pi 5 mit 64-Bit Raspberry Pi OS)
            
            Einfach entpacken und starten (`Lumio.exe` auf Windows, `./run-lumio.sh` auf Linux).
          files: |
            ./dist/Lumio-win-x64.zip
            ./dist/Lumio-win-arm64.zip
            ./dist/Lumio-linux-x64.zip
            ./dist/Lumio-linux-arm64.zip
          draft: false
          prerelease: false
